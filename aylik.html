<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <title>Aylık Hesap · Fidan Çanta</title>
    <link rel="stylesheet" href="style.css?v=4">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});}).catch(function(){});
            if (window.caches) caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});}).catch(function(){});
        }
    </script>
</head>

<body>

    <header class="topbar">
        <button class="menu-btn" type="button" onclick="toggleMenu()" aria-label="Menüyü aç"><span></span></button>
        <div class="brand">
            <span class="brand-logo"><img src="logo.png" alt="Fidan Çanta"></span>
            <span class="brand-text">
                <span class="brand-name">FİDAN ÇANTA</span>
                <span class="brand-sub">Aylık Hesap</span>
            </span>
        </div>
    </header>

    <nav class="side-menu" id="sideMenu">
        <div class="menu-head">
            <span class="brand-logo"><img src="logo.png" alt=""></span>
            <span class="brand-name">FİDAN ÇANTA</span>
        </div>
        <div class="menu-scroll">
            <div class="menu-item" onclick="location.href='index.html'">Kasa</div>
            <div class="menu-item" onclick="location.href='musteri.html'">Müşteriler / Alacaklar</div>
            <div class="menu-item" onclick="location.href='toptanci.html'">Toptancılar / Borçlar</div>
        </div>
        <div class="menu-footer">
            <button type="button" class="menu-item" onclick="exportData()">Tüm Verileri Yedekle</button>
            <button type="button" class="menu-item" onclick="importData()">Yedekten Geri Yükle</button>
        </div>
    </nav>
    <div class="menu-overlay" onclick="toggleMenu()"></div>

    <main class="page">

        <section class="card">
            <label class="field">
                <span class="field-label">Ay Seçin</span>
                <input type="month" id="monthPicker" onchange="loadMonthlySummary()">
            </label>
        </section>

        <section class="card card-flush">
            <h2 class="card-title">Günlere Göre Kasa</h2>
            <div class="table-responsive">
                <table id="summaryTable">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Nakit</th>
                            <th>Visa</th>
                            <th>Havale</th>
                            <th>Toplam</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                    <tfoot>
                        <tr>
                            <td>Genel Toplam</td>
                            <td id="totalCash">0 ₺</td>
                            <td id="totalVisa">0 ₺</td>
                            <td id="totalTransfer">0 ₺</td>
                            <td id="totalAll">0 ₺</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

    </main>

    <script src="common.js?v=4"></script>
    <script src="app.js?v=4"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mp = document.getElementById("monthPicker");
            if (mp) {
                const now = new Date();
                const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                mp.value = ym;
                if (typeof loadMonthlySummary === "function") {
                    setTimeout(loadMonthlySummary, 100);
                }
            }
        });
    </script>
</body>

</html>
